<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Illustration of a building materials manufacturing yard">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14213D"/>
      <stop offset="100%" stop-color="#243456"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#sky)"/>
  <circle cx="960" cy="200" r="120" fill="#E0672B" opacity="0.18"/>

  <!-- distant warehouse silhouette -->
  <g opacity="0.55">
    <rect x="60" y="420" width="360" height="220" fill="#0E1830"/>
    <polygon points="60,420 240,340 420,420" fill="#0E1830"/>
    <rect x="150" y="470" width="50" height="80" fill="#243456"/>
    <rect x="260" y="470" width="50" height="80" fill="#243456"/>
    <rect x="70" y="360" width="18" height="90" fill="#0E1830"/>
  </g>

  <!-- main factory shed -->
  <g>
    <rect x="640" y="380" width="500" height="280" fill="#0E1830"/>
    <polygon points="640,380 890,300 1140,380" fill="#182645"/>
    <rect x="700" y="450" width="70" height="120" fill="#243456"/>
    <rect x="800" y="450" width="70" height="120" fill="#243456"/>
    <rect x="990" y="450" width="120" height="70" fill="#1A2A4C"/>
    <rect x="960" y="330" width="26" height="110" fill="#0E1830"/>
  </g>

  <!-- ground -->
  <rect x="0" y="660" width="1200" height="240" fill="#1B2A4A"/>

  <!-- pallet of bricks, foreground -->
  <g>
    <rect x="120" y="820" width="420" height="24" fill="#0E1830"/>
    <!-- row 1 -->
    <g>
      <polygon points="150,760 250,730 350,760 250,790" fill="#B5502E"/>
      <polygon points="150,760 150,795 250,825 250,790" fill="#8F3E24"/>
      <polygon points="250,790 250,825 350,795 350,760" fill="#752F17"/>
    </g>
    <g>
      <polygon points="330,760 430,730 530,760 430,790" fill="#B5502E"/>
      <polygon points="330,760 330,795 430,825 430,790" fill="#8F3E24"/>
      <polygon points="430,790 430,825 530,795 530,760" fill="#752F17"/>
    </g>
    <!-- row 2 stacked -->
    <g>
      <polygon points="190,710 290,680 390,710 290,740" fill="#BEC3C8"/>
      <polygon points="190,710 190,745 290,775 290,740" fill="#8D9298"/>
      <polygon points="290,740 290,775 390,745 390,710" fill="#6D7278"/>
      <ellipse cx="240" cy="705" rx="12" ry="6" fill="#2B2F33"/>
      <ellipse cx="290" cy="722" rx="12" ry="6" fill="#2B2F33"/>
    </g>
  </g>

  <!-- orange accent stripe -->
  <rect x="0" y="878" width="1200" height="6" fill="#E0672B"/>
</svg>
