<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Careers Admin | Velorr Industries</title><link rel="stylesheet" href="../assets/careers.css"></head><body>
<header class="top"><a class="brand" href="/">VELORR INDUSTRIES · ADMIN</a><nav><a href="../careers/">View Careers Page</a><a href="../">Main website</a></nav></header><main class="admin">
<section id="login" class="panel"><h1>Admin login</h1><p class="muted">Sign in using the authorized admin account.</p><form id="loginForm"><div class="grid"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div></div><button class="btn">Sign in</button><p id="loginMsg"></p></form></section>
<section id="dash" class="hidden"><div class="panel"><button id="logout" class="btn secondary">Sign out</button><h1>Job management</h1><p class="muted">Add, edit, publish, unpublish or delete vacancies.</p></div>
<div class="panel"><h2 id="formTitle">Add a job</h2><form id="jobForm"><input type="hidden" id="id"><div class="grid">
<div class="field"><label>Job title *</label><input id="job_title" required maxlength="120"></div><div class="field"><label>Department</label><input id="department"></div>
<div class="field"><label>Location</label><input id="location" value="Gunamangalam, Cuddalore"></div><div class="field"><label>Employment type</label><select id="employment_type"><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Temporary</option><option>Apprenticeship</option></select></div>
<div class="field"><label>Experience</label><input id="experience" placeholder="e.g. 1–3 years"></div><div class="field"><label>Vacancies</label><input id="vacancies" type="number" min="1" value="1"></div>
<div class="field"><label>Salary (optional)</label><input id="salary"></div><div class="field"><label>Application deadline</label><input id="application_deadline" type="date"></div>
<div class="field full"><label>Job description *</label><textarea id="description" required></textarea></div><div class="field full"><label>Requirements / qualifications</label><textarea id="requirements"></textarea></div>
<div class="field"><label>Status</label><select id="status"><option value="draft">Draft</option><option value="published">Published</option></select></div></div><button class="btn">Save job</button> <button type="button" id="clear" class="btn secondary">Clear</button><p id="formMsg"></p></form></div>
<div class="panel"><h2>Existing jobs</h2><div id="jobRows">Loading…</div></div></section><p id="setupMsg" class="error"></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/supabase-config.js"></script><script>
const $=id=>document.getElementById(id);let db;const keys=['job_title','department','location','employment_type','experience','vacancies','salary','application_deadline','description','requirements','status'];
function say(id,t,c=''){ $(id).textContent=t;$(id).className=c}
function clearForm(){$('jobForm').reset();$('id').value='';$('location').value='Gunamangalam, Cuddalore';$('vacancies').value=1;$('formTitle').textContent='Add a job'}
async function refresh(){const {data,error}=await db.from('jobs').select('*').order('created_at',{ascending:false});if(error){$('jobRows').textContent=error.message;return}if(!data.length){$('jobRows').textContent='No jobs yet.';return}
$('jobRows').innerHTML=data.map(j=>`<div class="row"><div><b>${j.job_title.replace(/[&<>"]/g,'')}</b><div class="meta">${j.location||''} · <span class="status ${j.status==='draft'?'draft':''}">${j.status}</span></div></div><div><button class="btn secondary" data-edit="${j.id}">Edit</button> <button class="btn secondary" data-toggle="${j.id}" data-status="${j.status}">${j.status==='published'?'Unpublish':'Publish'}</button> <button class="btn danger" data-del="${j.id}">Delete</button></div></div>`).join('')}
async function init(){if(!window.supabase||!window.VELORR_SUPABASE_URL||window.VELORR_SUPABASE_URL.includes('YOUR_')){say('setupMsg','Configure Supabase in /assets/supabase-config.js before using admin.');return}db=window.supabase.createClient(window.VELORR_SUPABASE_URL,window.VELORR_SUPABASE_ANON_KEY);const {data:{session}}=await db.auth.getSession();if(session)await showDash()}
async function showDash(){const {data:{session}}=await db.auth.getSession();if(!session)return;const {data,error}=await db.from('admin_users').select('user_id').eq('user_id',session.user.id).maybeSingle();if(error||!data){await db.auth.signOut();say('loginMsg','This account is not authorized.','error');return}$('login').classList.add('hidden');$('dash').classList.remove('hidden');await refresh()}
$('loginForm').onsubmit=async e=>{e.preventDefault();if(!db)return;say('loginMsg','Signing in…');const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){say('loginMsg',error.message,'error');return}await showDash()};
$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};$('clear').onclick=clearForm;
$('jobForm').onsubmit=async e=>{e.preventDefault();const r={};keys.forEach(k=>r[k]=$(k).value.trim()||null);r.vacancies=Number(r.vacancies||1);const id=$('id').value;const q=id?db.from('jobs').update(r).eq('id',id):db.from('jobs').insert(r);const {error}=await q;if(error){say('formMsg',error.message,'error');return}say('formMsg','Job saved.','success');clearForm();await refresh()};
$('jobRows').onclick=async e=>{const t=e.target;if(t.dataset.edit){const {data,error}=await db.from('jobs').select('*').eq('id',t.dataset.edit).single();if(error)return alert(error.message);keys.forEach(k=>$(k).value=data[k]??'');$('id').value=data.id;$('formTitle').textContent='Edit job';window.scrollTo(0,0)}if(t.dataset.toggle){const status=t.dataset.status==='published'?'draft':'published';const {error}=await db.from('jobs').update({status}).eq('id',t.dataset.toggle);if(error)return alert(error.message);await refresh()}if(t.dataset.del&&confirm('Delete this job permanently?')){const {error}=await db.from('jobs').delete().eq('id',t.dataset.del);if(error)return alert(error.message);await refresh()}};
init();</script></body></html>
